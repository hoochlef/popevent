[project]
name = "Popevent"
version = "0.1.0"
description = "Browse the latest events in your niche or create your own."
readme = "README.md"
requires-python = ">=3.14"

dependencies = [
    "django>=6.0.1",
    "psycopg[binary]>=3.3.2",
]

[dependency-groups]
dev = [
    "ruff>=0.15.2",
    "python-dotenv>=1.2.1",
    "djlint>=1.36.4",
    "django-debug-toolbar>=6.2.0",
]

# ~~~~~~~ ruff config ~~~~~~~~~~
## line length
[tool.ruff]
# Set the maximum line length to 100.
line-length = 100

[tool.ruff.lint]
# Add the `line-too-long` rule to the enforced rule set.
extend-select = [
    "E501", # line-too-long rule,
    # "D" # pydocstyle rule, 
    "DJ" # Django rules
]

# ~~~~~~~~~ djlint config ~~~~~~~~~~
[tool.djlint]
profile="django"
ignore = "H031" # Ignore specific HTML rules | H006,H030

