[project]
name = "Popevent"
license = "MIT"
version = "0.1.0"
description = "Browse the latest events in your niche or create your own."
readme = "README.md"
requires-python = ">=3.14"

dependencies = [
    "django>=6.0.1",
    "psycopg[binary]>=3.3.2",
]

[dependency-groups]
dev = [
    "ruff>=0.15.2",
    "python-dotenv>=1.2.1",
    "djlint>=1.36.4",
    "django-debug-toolbar>=6.2.0",
]

# ~~~~~~~ ruff config ~~~~~~~~~~
[tool.ruff.lint]
extend-select = [
    "DJ" # Django rules
]

# ~~~~~~~~~ djlint config ~~~~~~~~~~
[tool.djlint]
profile="django"
ignore = "H031" # Ignore specific HTML rules | H006,H030

